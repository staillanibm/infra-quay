# Smoke-test Job: pushes a minimal image to the registry and pulls it back.
#
# Prerequisites — run `make smoke-test QUAY_USER=<user> QUAY_PASS=<pass>` which
# creates secret/quay-smoke-credentials before applying this job.
#
# Credentials are obtained from the Quay UI after first login:
#   1. Log in at the registry URL
#   2. Create an organisation and a robot account
#   3. Pass the robot credentials to `make smoke-test`
#
# The job uses skopeo: no Docker daemon, no root, runs fine under restricted-v2.
# ttlSecondsAfterFinished cleans up the pod automatically after 60 s.
apiVersion: batch/v1
kind: Job
metadata:
  name: quay-smoke-test
  namespace: quay
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          # UBI9-based skopeo — includes bash, OCI-native, no daemon, no root.
          image: registry.access.redhat.com/ubi9/skopeo:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              REGISTRY="${QUAY_HOST}"
              REPO="${REGISTRY}/${QUAY_ORG}/smoke"
              TAG="v1"

              echo "==> [1/3] Logging in to ${REGISTRY}"
              skopeo login "${REGISTRY}" \
                --username "${QUAY_USER}" \
                --password "${QUAY_PASSWORD}" \
                --tls-verify=false

              echo "==> [2/3] Copying busybox:latest → ${REPO}:${TAG}"
              skopeo copy \
                --dest-tls-verify=false \
                docker://busybox:latest \
                "docker://${REPO}:${TAG}"

              echo "==> [3/3] Inspecting ${REPO}:${TAG}"
              skopeo inspect --tls-verify=false "docker://${REPO}:${TAG}" \
                | grep -q '"Name"'

              echo "==> SMOKE TEST PASSED"
          env:
            - name: QUAY_HOST
              valueFrom:
                secretKeyRef:
                  name: quay-smoke-credentials
                  key: host
            - name: QUAY_ORG
              valueFrom:
                secretKeyRef:
                  name: quay-smoke-credentials
                  key: org
            - name: QUAY_USER
              valueFrom:
                secretKeyRef:
                  name: quay-smoke-credentials
                  key: username
            - name: QUAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quay-smoke-credentials
                  key: password
          resources:
            requests:
              memory: 128Mi
              cpu: "100m"
            limits:
              memory: 256Mi
              cpu: "500m"
